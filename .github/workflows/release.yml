name: Release

# Stable release - MANUAL dispatch only. Builds VGAMAUS.EXE via the reusable
# _build.yml (where the toolchain is REQUIRED) and publishes the ready-to-run
# DOS executable as a GitHub release asset.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Defaults to 0.1.<run-number>.'
        required: false
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Required structural gate before we spend time on the real build.
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # the build number is a commit count
      # The base now comes from the repo's VERSION file rather than the run number, which reset the
      # patch on every workflow re-run and made two builds of the same commit claim different
      # versions. The shared versioner appends the commit count.
      - id: auto
        uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: print
      - id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${{ steps.auto.outputs.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Package version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      # The repo-level marker is the DATE, like every other Hawkynt repo; the executable's own
      # MAJOR.MINOR.PATCH.BUILD stays the package version and is quoted alongside it.
      - name: Compose release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## PB-VGAEditor v$V

          Ready-to-run **DOS executable** \`VGAMAUS.EXE\`, compiled from source with
          PowerBASIC 3.5. Run it directly in DOSBox or on real DOS hardware - no
          install step required.
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }} (v${{ needs.version.outputs.version }})
          files: dist/VGAMAUS.EXE
          body_path: RELEASE_NOTES.md
