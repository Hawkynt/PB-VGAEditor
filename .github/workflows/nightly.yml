name: Nightly

# Fires after CI passes on main (a red CI never produces a nightly, so the
# "latest nightly" always points at tested code), plus manual dispatch. Builds
# VGAMAUS.EXE via the reusable _build.yml and publishes it to a rolling nightly
# pre-release.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    # Only on a green CI run (or manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_build.yml
    with:
      version: nightly
      advisory: true
    secrets: inherit

  publish:
    needs: build
    if: ${{ needs.build.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      # Dated nightlies, like every other Hawkynt repo: a single rolling `nightly` tag silently
      # moved under previously-downloaded assets and gave the GFS prune nothing to work with.
      - name: Compute nightly tag
        run: echo "TAG=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      # Same-day re-run: drop the existing release AND its tag first, so the tag always points at
      # the commit that was actually built.
      - name: Replace same-day nightly (release + tag), if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --cleanup-tag --yes || true
      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Nightly ${{ env.TAG }} (${{ github.sha }})
          prerelease: true
          files: dist/VGAMAUS.EXE
          body: |
            Automated nightly build of `VGAMAUS.EXE`, compiled from source with PowerBASIC 3.5
            after CI passed on `main`. Commit ${{ github.sha }}.
